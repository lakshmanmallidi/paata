<text x="845.0" y="120.0" font-size="10" text-anchor="end" fill="#222" font-weight="normal">knob</text>
<rect x="945.0" y="205.0" width="9.0" height="40.0" fill="#555" stroke="#111" rx="2"/>
<text x="960.0" y="229.0" font-size="9" text-anchor="start" fill="#222" font-weight="normal">PREV</text>
<rect x="945.0" y="265.0" width="9.0" height="40.0" fill="#555" stroke="#111" rx="2"/>
<text x="960.0" y="289.0" font-size="9" text-anchor="start" fill="#222" font-weight="normal">NEXT</text>
<text x="845.0" y="547.0" font-size="12.5" text-anchor="middle" fill="#0b4a8f" font-weight="bold">about 40 × 70 × 16 mm including the knob</text>
<text x="845.0" y="567.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Slimmest in the pocket; knob sits next to</text>
<text x="845.0" y="583.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">the headphone jack, protected by the cable.</text>
<text x="845.0" y="599.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Two-handed use for scrolling.</text>
</svg>