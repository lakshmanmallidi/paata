<text x="510.0" y="547.0" font-size="12.5" text-anchor="middle" fill="#0b4a8f" font-weight="bold">about 48 × 62 × 16 mm including the knob</text>
<text x="510.0" y="567.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Shortest case; thumb reaches knob and buttons.</text>
<text x="510.0" y="583.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Buttons must be mounted sideways.</text>
<text x="510.0" y="599.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Knob widens the pocket footprint.</text>
<text x="845.0" y="80.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">C · Knob on the top edge</text>
<rect x="710.0" y="95.0" width="270.0" height="428.0" fill="none" stroke="#aaa" stroke-dasharray="6 5" rx="15"/>
<rect x="745.0" y="135.0" width="200.0" height="310.0" fill="#2f3440" stroke="#111" stroke-width="2" rx="20"/>
