<text x="510.0" y="410.0" font-size="9" text-anchor="middle" fill="#8a93a6" font-weight="normal">display board</text>
<rect x="610.0" y="175.0" width="40.0" height="75.0" fill="#b9bec7" stroke="#555" stroke-width="2" rx="3"/>
<line x1="613" y1="190" x2="647" y2="190" stroke="#777"/>
<line x1="613" y1="205" x2="647" y2="205" stroke="#777"/>
<line x1="613" y1="220" x2="647" y2="220" stroke="#777"/>
<line x1="613" y1="235" x2="647" y2="235" stroke="#777"/>
