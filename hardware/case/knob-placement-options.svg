<text x="510.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Paata case — where the knob goes (front views, to scale)</text>
<text x="510.0" y="50" font-size="11.5" text-anchor="middle" fill="#555">Dashed grey outline = a credit card (54 × 85.6 mm) for scale. Sizes are rough; the battery has not been measured yet.</text>
<text x="175.0" y="80.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">A · Knob on the front</text>
<rect x="40.0" y="95.0" width="270.0" height="428.0" fill="none" stroke="#aaa" stroke-dasharray="6 5" rx="15"/>
<rect x="75.0" y="95.0" width="200.0" height="400.0" fill="#2f3440" stroke="#111" stroke-width="2" rx="20"/>
<rect x="87.5" y="107.5" width="175.0" height="285.0" fill="none" stroke="#8a93a6" stroke-dasharray="4 4" rx="2"/>
<rect x="105.0" y="162.5" width="140.0" height="175.0" fill="#0b1a2b" stroke="#5d7fa8" rx="2"/>
<text x="175.0" y="242.5" font-size="11" text-anchor="middle" fill="#9db7d6" font-weight="normal">screen</text>
<text x="175.0" y="260.0" font-size="9.5" text-anchor="middle" fill="#7f9bbd" font-weight="normal">28 × 35 mm</text>
<text x="175.0" y="370.0" font-size="9" text-anchor="middle" fill="#8a93a6" font-weight="normal">display board</text>
<circle cx="175" cy="440" r="40" fill="#b9bec7" stroke="#555" stroke-width="2"/>
<circle cx="175" cy="440" r="10" fill="#8d939d"/>
<circle cx="102.5" cy="440" r="15" fill="#555" stroke="#ddd"/>
<text x="102.5" y="444.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal">◂</text>
<circle cx="247.5" cy="440" r="15" fill="#555" stroke="#ddd"/>
<text x="247.5" y="444.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal">▸</text>
<text x="175.0" y="547.0" font-size="12.5" text-anchor="middle" fill="#0b4a8f" font-weight="bold">about 40 × 80 × 16 mm, knob stands 10 mm proud</text>
<text x="175.0" y="567.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Easiest to use and to build.</text>
<text x="175.0" y="583.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Longest case; knob sticks out of the face</text>
<text x="175.0" y="599.0" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">and can turn by itself in a pocket.</text>
<text x="510.0" y="80.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">B · Knob on the side</text>
<rect x="375.0" y="95.0" width="270.0" height="428.0" fill="none" stroke="#aaa" stroke-dasharray="6 5" rx="15"/>
<rect x="410.0" y="135.0" width="200.0" height="310.0" fill="#2f3440" stroke="#111" stroke-width="2" rx="20"/>
