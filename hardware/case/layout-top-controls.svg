<text x="505.0" y="270.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">battery</text>
<text x="505.0" y="287.5" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">10.9 mm thick</text>
<rect x="597.5" y="312.5" width="95.0" height="120.0" fill="#dfe7f5" stroke="#3b5b92" rx="2" stroke-dasharray="5 4"/>
<text x="645.0" y="370.0" font-size="9.5" text-anchor="middle" fill="#27437a" font-weight="normal">SD adapter</text>
<text x="645.0" y="385.0" font-size="9" text-anchor="middle" fill="#27437a" font-weight="normal">(in front)</text>
<rect x="430.0" y="347.5" width="101.0" height="140.0" fill="#22252b" stroke="#000" rx="2"/>
<rect x="460.0" y="487.5" width="40.0" height="17.0" fill="#3a3a3a" stroke="#000" rx="2"/>
<text x="480.0" y="420.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">DAC</text>
<rect x="533.5" y="364.0" width="86.5" height="133.5" fill="#2a7fb8" stroke="#0c3a5a" rx="2"/>
<text x="576.5" y="425.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal">charger</text>
<text x="576.5" y="442.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="normal">TP4056</text>
<rect x="622.0" y="378.5" width="89.5" height="119.0" fill="#1f4e8c" stroke="#0c2a52" rx="2"/>
<text x="666.5" y="440.0" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">ESP32</text>
<text x="480.0" y="527.5" font-size="10" text-anchor="middle" fill="#0b4a8f" font-weight="bold">jack</text>
<text x="576.5" y="527.5" font-size="10" text-anchor="middle" fill="#0b4a8f" font-weight="bold">charge</text>
<text x="666.5" y="527.5" font-size="10" text-anchor="middle" fill="#0b4a8f" font-weight="bold">data</text>
<text x="570.0" y="545.0" font-size="10" text-anchor="middle" fill="#555" font-weight="normal">three openings on the bottom edge</text>
<text x="862.5" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Side</text>
<text x="862.5" y="88" font-size="10.5" text-anchor="middle" fill="#555">front of the case on the left</text>
<rect x="827.5" y="100.0" width="70.0" height="50.0" fill="#b9bec7" stroke="#555" rx="3"/>
<rect x="800.0" y="150.0" width="125.0" height="355.0" fill="#f4f5f7" stroke="#111" rx="6"/>
<rect x="808.0" y="157.5" width="108.5" height="8.0" fill="#16181c" stroke="#000" rx="2"/>
<rect x="830.0" y="165.5" width="65.0" height="35.0" fill="#9aa0a6" stroke="#555" rx="2"/>
<rect x="807.5" y="207.5" width="23.0" height="291.0" fill="#b3261e" stroke="#7f1010" rx="2"/>
<rect x="830.5" y="297.5" width="15.0" height="150.0" fill="#c9ccd1" stroke="#666" rx="2"/>
<rect x="848.0" y="210.0" width="54.5" height="132.5" fill="#f2c94c" stroke="#8a6d00" rx="2"/>
<rect x="848.0" y="347.5" width="35.0" height="140.0" fill="#22252b" stroke="#000" rx="2"/>
<line x1="929" y1="185" x2="943" y2="185" stroke="#888"/>
<text x="947.5" y="189.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">encoder</text>
<line x1="929" y1="275" x2="943" y2="275" stroke="#888"/>
<text x="947.5" y="279.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">battery</text>
<line x1="929" y1="375" x2="943" y2="375" stroke="#888"/>
<text x="947.5" y="379.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">display + SD slot</text>
<line x1="929" y1="425" x2="943" y2="425" stroke="#888"/>
<text x="947.5" y="429.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">DAC</text>
<text x="862.5" y="527.5" font-size="11" text-anchor="middle" fill="#0b4a8f" font-weight="bold">25 mm thick</text>
<text x="60" y="575" font-size="11.5" fill="#333">• Top edge: knob on the right, BACK and OK beside it. The encoder board stands on edge under the top wall, so it sets the 25 mm thickness.</text>
<text x="60" y="593" font-size="11.5" fill="#333">• The display moves down 10 mm to make room for that strip, which is why the case is 71 mm tall.</text>
<text x="60" y="611" font-size="11.5" fill="#333">• Bottom edge: headphone jack, charging port and the ESP32's USB port side by side, which is why it is 60 mm wide.</text>
</svg>