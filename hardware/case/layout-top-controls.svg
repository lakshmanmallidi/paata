<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="Helvetica, Arial, sans-serif">
<rect width="1060" height="640" fill="#fff"/>
<text x="530.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Paata case draft — knob and buttons on the top edge (to scale)</text>
<text x="530.0" y="50" font-size="11.5" text-anchor="middle" fill="#555">About 60 × 71 × 25 mm with the parts as measured. Battery drawn as 30 × 36 mm: its length and width are assumed.</text>
<text x="210" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Front</text>
<text x="210" y="88" font-size="10.5" text-anchor="middle" fill="#555">what you see and touch</text>
