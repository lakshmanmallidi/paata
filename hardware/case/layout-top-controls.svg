<text x="152.5" y="345.0" font-size="11" text-anchor="middle" fill="#9db7d6" font-weight="normal">screen</text>
<text x="152.5" y="362.5" font-size="9.5" text-anchor="middle" fill="#7f9bbd" font-weight="normal">28 × 35 mm</text>
<rect x="237.5" y="312.5" width="95.0" height="120.0" fill="none" stroke="#9fb3d9" rx="2" stroke-dasharray="5 4"/>
<text x="285.0" y="370.0" font-size="9.5" text-anchor="middle" fill="#c9d6ee" font-weight="normal">SD adapter</text>
<text x="285.0" y="385.0" font-size="9" text-anchor="middle" fill="#c9d6ee" font-weight="normal">(inside)</text>
<text x="210.0" y="527.5" font-size="11" text-anchor="middle" fill="#0b4a8f" font-weight="bold">60 mm wide · 71 mm tall</text>
<text x="570" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Inside, behind the display</text>
<text x="570" y="88" font-size="10.5" text-anchor="middle" fill="#555">same view as the front, looking through it</text>
<rect x="605.0" y="100.0" width="70.0" height="50.0" fill="#b9bec7" stroke="#555" rx="3"/>
<text x="640.0" y="130.0" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">knob</text>
<rect x="460.0" y="139.0" width="30.0" height="11.0" fill="#555" stroke="#111" rx="2"/>
<text x="475.0" y="130.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">BACK</text>
<rect x="515.0" y="139.0" width="30.0" height="11.0" fill="#555" stroke="#111" rx="2"/>
<text x="530.0" y="130.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">OK</text>
<rect x="420.0" y="150.0" width="300.0" height="355.0" fill="#f4f5f7" stroke="#111" rx="10"/>
