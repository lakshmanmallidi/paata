<text x="115.0" y="130.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">BACK</text>
<rect x="155.0" y="139.0" width="30.0" height="11.0" fill="#555" stroke="#111" rx="2"/>
<text x="170.0" y="130.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">OK</text>
<rect x="60.0" y="150.0" width="300.0" height="355.0" fill="#2f3440" stroke="#111" rx="10"/>
<rect x="67.5" y="207.5" width="170.0" height="291.0" fill="none" stroke="#8a93a6" rx="2" stroke-dasharray="4 4"/>
