; Paata firmware — Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4 MB flash, 2 MB QSPI PSRAM)
;
; ESP32-audioI2S 4.x needs Arduino core 3.x, which the official PlatformIO
; espressif32 platform does not ship. pioarduino is the community platform that does.

[env:paata]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; 3 MB app, no OTA slot: the audio library is large and 4 MB flash is tight
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Removes the generic "SD" library that the Adafruit ST7735 library pulls in;
; it does not support ESP32 and shadows the core's own SD. See the script.
; patch_audio_lib.py makes the audio library seek past large embedded cover pictures.
extra_scripts =
    pre:drop_stray_libs.py
    pre:patch_audio_lib.py

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.1
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    madhephaestus/ESP32Encoder
    bodmer/TJpg_Decoder
